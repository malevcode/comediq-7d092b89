name: Seed audience shows

# Uploads the curated shows in scripts/ingest/audience_shows_seed.json to the
# audience_shows table. Safe to re-run: each show is looked up before it is
# inserted, so nothing is duplicated or overwritten.
#
# Two ways to run:
#   - Manually, where dry run defaults to on, for previewing a batch.
#   - Automatically, when a push to main changes the seed file, the seed script,
#     or this workflow. A push carries no inputs, so `inputs.dry_run` is empty
#     and the run WRITES. Review happens on the pull request; merging is the
#     upload.
#
# Manual-only was why the September shows never reached the database: the batch
# was committed and nobody ever clicked Run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only, write nothing"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - scripts/ingest/audience_shows_seed.json
      - scripts/ingest/seed_audience_shows.py
      - .github/workflows/seed_audience_shows.yaml

# This job writes to the database, so never let two runs overlap.
concurrency:
  group: seed-audience-shows
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Seed shows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/ingest/seed_audience_shows.py \
            ${{ inputs.dry_run && '--dry-run' || '' }}
