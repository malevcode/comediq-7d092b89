name: Refresh mics.json

on:
  schedule:
    # Nightly refresh at 9 PM New York time during daylight saving time.
    # GitHub cron is UTC and scheduled jobs can be delayed, so do not add an
    # in-workflow wall-clock gate.
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-mics-json
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Update branch before export
        run: git pull --rebase

      - name: Export mics from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          REQUIRE_MIC_EXPORT: "true"
        run: npm run export:mics

      - name: Commit updated mics.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mics.json
          git commit --allow-empty -m "Refresh mics.json"
          git push
