name: Apply open mic updates

# Manual only. Applies the curated batch in
# scripts/ingest/open_mic_updates.json to the open_mics table.
# Afterwards run "Refresh mics.json" to regenerate the public cache.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only, write nothing"
        type: boolean
        default: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Apply updates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/ingest/apply_open_mic_updates.py \
            ${{ inputs.dry_run && '--dry-run' || '' }}
