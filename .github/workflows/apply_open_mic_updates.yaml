name: Apply open mic updates

# Applies the curated batch in scripts/ingest/open_mic_updates.json to the
# open_mics_historical table.
#
# Two ways to run:
#   - Manually, where dry run defaults to on, for previewing a batch.
#   - Automatically, when a push to main changes the batch or this workflow.
#     A push carries no inputs, so `inputs.dry_run` is empty and the run
#     WRITES. Review happens on the pull request; merging is the apply.
#
# Afterwards the open_mics_historical trigger regenerates public/mics.json.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only, write nothing"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - scripts/ingest/open_mic_updates.json
      - .github/workflows/apply_open_mic_updates.yaml

# This job writes to the database, so never let two runs overlap.
concurrency:
  group: apply-open-mic-updates
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Apply updates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/ingest/apply_open_mic_updates.py \
            ${{ inputs.dry_run && '--dry-run' || '' }}
