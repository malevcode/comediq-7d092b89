<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a listing: states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 2676px; height: 996px; box-sizing: border-box; padding: 48px; background: #0E1A36; font-family: 'DM Sans', system-ui, sans-serif; color: #F4EDE1; display: flex; gap: 48px">
  <sc-for list="{{states}}" as="s" hint-placeholder-count="6">
    <div style="display: flex; flex-direction: column; gap: 16px; flex: 0 0 390px">
      <div style="height: 40px; display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700">
        <span style="width: 14px; height: 14px; border-radius: 50%; background: {{s.dot}}"></span>
        {{s.label}}
      </div>
      <div style="width: 390px; height: 844px; border-radius: 36px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.35)">
        <dc-import name="ListingFlow" scene="{{s.scene}}" hint-size="390px,844px"></dc-import>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2676,"height":996}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      states: [
        { scene: 'micEmpty', label: 'Mic: empty', dot: '#9AA6C2' },
        { scene: 'micVenueNotFound', label: 'Venue not found', dot: '#F2C14E' },
        { scene: 'micError', label: 'Validation errors', dot: '#FFB4A8' },
        { scene: 'edit', label: 'Edit listing (pre-filled)', dot: '#F4EDE1' },
        { scene: 'micCalendar', label: 'Calendar picks fill day + how often', dot: '#8FC2F5' },
        { scene: 'success', label: 'Published', dot: '#3DBE74' }
      ]
    };
  }
}
</script>
</body>
</html>
