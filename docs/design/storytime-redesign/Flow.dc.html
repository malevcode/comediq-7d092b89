<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comediq every screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 3114px; height: 996px; box-sizing: border-box; padding: 48px; background: #173A7A; font-family: 'Instrument Sans', system-ui, sans-serif; color: #F4EDE1; display: flex; gap: 48px">
  <sc-for list="{{screens}}" as="s" hint-placeholder-count="7">
    <div style="display: flex; flex-direction: column; gap: 16px; flex: 0 0 390px">
      <div style="height: 40px; display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: #8FC2F5; color: #08142B; font-size: 15px; display: flex; align-items: center; justify-content: center">{{s.n}}</span>
        {{s.label}}
      </div>
      <div style="width: 390px; height: 844px; border-radius: 36px; overflow: hidden; box-shadow: 0 20px 50px rgba(18,26,51,.18)">
        <dc-import name="Main" scene="{{s.scene}}" hint-size="390px,844px"></dc-import>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":3114,"height":996}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['home', 'Home'],
      ['map', 'Map'],
      ['detail', 'Mic detail'],
      ['signup', 'Sign up sheet'],
      ['before', 'My sign up'],
      ['sets', 'Sets'],
      ['profile', 'Profile']
    ];
    return { screens: list.map((x, i) => ({ n: i + 1, scene: x[0], label: x[1] })) };
  }
}
</script>
</body>
</html>
