<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comediq sign up states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1800px; height: 996px; box-sizing: border-box; padding: 48px; background: #173A7A; font-family: 'Instrument Sans', system-ui, sans-serif; color: #F4EDE1; display: flex; gap: 48px">
  <sc-for list="{{states}}" as="s" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 16px; flex: 0 0 390px">
      <div style="height: 40px; display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700">
        <span style="width: 14px; height: 14px; border-radius: 50%; background: {{s.dot}}"></span>
        {{s.label}}
      </div>
      <div style="width: 390px; height: 844px; border-radius: 36px; overflow: hidden; box-shadow: 0 20px 50px rgba(18,26,51,.18)">
        <dc-import name="Main" scene="{{s.scene}}" hint-size="390px,844px"></dc-import>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1800,"height":996}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      states: [
        { scene: 'loading', label: 'Loading: confirming sign up', dot: '#7E97C9' },
        { scene: 'before', label: 'Before check-in (out of range)', dot: '#9AA3B2' },
        { scene: 'inRange', label: 'In range: Check In appears', dot: '#8FC2F5' },
        { scene: 'checkedIn', label: 'Checked in: spot + set unlocked', dot: '#3DBE74' }
      ]
    };
  }
}
</script>
</body>
</html>
