<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a listing: open mic path</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1800px; height: 996px; box-sizing: border-box; padding: 48px; background: #0E1A36; font-family: 'DM Sans', system-ui, sans-serif; color: #F4EDE1; display: flex; gap: 48px">
  <sc-for list="{{screens}}" as="s" hint-placeholder-count="6">
    <div style="display: flex; flex-direction: column; gap: 16px; flex: 0 0 390px">
      <div style="height: 40px; display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: #8FC2F5; color: #08142B; font-size: 15px; display: flex; align-items: center; justify-content: center">{{s.n}}</span>
        {{s.label}}
      </div>
      <div style="width: 390px; height: 844px; border-radius: 36px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.35)">
        <dc-import name="ListingFlow" scene="{{s.scene}}" hint-size="390px,844px"></dc-import>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1800,"height":996}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['chooser', 'What are you listing?'],
      ['micFilled', 'One-page form'],
      ['micPreview', 'Preview'],
      ['success', 'Published']
    ];
    return { screens: list.map((x, i) => ({ n: i + 1, scene: x[0], label: x[1] })) };
  }
}
</script>
</body>
</html>
